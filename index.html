<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Brawl: Math, Code & AI</title>
<meta name="description" content="A game for curious kids: 6th grade math, real coding in Lua (the language behind Roblox), and how AI works. Learn it, practice it, beat the boss.">
<meta name="theme-color" content="#1E1650">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='14' width='84' height='78' rx='26' fill='%233DD6FF' stroke='%23120C33' stroke-width='7'/%3E%3Crect x='24' y='38' width='20' height='18' rx='6' fill='%23120C33'/%3E%3Crect x='56' y='38' width='20' height='18' rx='6' fill='%23120C33'/%3E%3Cpath d='M34 68 Q50 82 66 68' stroke='%23120C33' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<header class="hud" id="hud" hidden>
  <div class="hud-in">
    <button class="hudme" id="hudMe" title="Heroes">
      <span class="mehead" id="hudHead"></span>
      <span class="metxt"><b id="hudName">Player</b><small id="hudTitle">Rookie</small></span>
    </button>
    <div class="xpwrap" title="Experience">
      <span class="lvbadge" id="hudLvl">1</span>
      <div class="xpbar"><i id="hudXp"></i><span id="hudXpT"></span></div>
    </div>
    <div class="pills">
      <button class="pill" id="navRoad" title="Star Road"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2.2l3 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.3l-6 3.1 1.2-6.6-4.8-4.6 6.6-.9z" fill="#FFC93C" stroke="#120C33" stroke-width="2.2" stroke-linejoin="round"/></svg><b id="hudStars">0</b></button>
      <button class="pill" id="navShop" title="Heroes and coins"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC93C" stroke="#120C33" stroke-width="2.6"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="#D9940B" stroke-width="2.6"/></svg><b id="hudCoins">0</b></button>
      <span class="pill streakpill" title="Day streak"><svg class="ic" viewBox="0 0 24 24"><path d="M12 22c-4.5 0-7-3-7-6.5 0-4 3.5-5.5 3.5-9.5 2.5 1.5 3 3.5 3 5 1-1 1.5-2.5 1.5-4 3 2 5 5 5 8.5 0 3.5-2.5 6.5-6 6.5z" fill="#FF8A3D" stroke="#120C33" stroke-width="2.2" stroke-linejoin="round"/></svg><b id="hudStreak">1</b></span>
    </div>
    <nav class="hudnav">
      <button class="iconbtn" id="navHome" title="Lobby" aria-label="Lobby"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <button class="iconbtn" id="navSound" title="Sound on/off" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button class="iconbtn" id="navParents" title="For grown-ups" aria-label="For grown-ups"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="sStart" class="screen" hidden></section>
  <section id="sLobby" class="screen" hidden></section>
  <section id="sWorld" class="screen" hidden></section>
  <section id="sLevel" class="screen" hidden></section>
  <section id="sLesson" class="screen" hidden></section>
  <section id="sPlay" class="screen" hidden></section>
  <section id="sBot" class="screen" hidden></section>
  <section id="sLua" class="screen" hidden></section>
  <section id="sLab" class="screen" hidden></section>
  <section id="sResult" class="screen" hidden></section>
  <section id="sShop" class="screen" hidden></section>
  <section id="sRoad" class="screen" hidden></section>
  <section id="sParents" class="screen" hidden></section>
</main>

<script src="vendor/fengari-web.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/math.js"></script>
<script src="js/code.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
